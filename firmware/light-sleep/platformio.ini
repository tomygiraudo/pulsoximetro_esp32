; Light-sleep for the PulsOx PCB (ESP32-C3 Super Mini + MAX30102).
; Not the real PulsOx firmware: it shuts the MAX30102 down (LEDs 0 mA) and leaves
; the ESP32-C3 in light sleep indefinitely, until another firmware is flashed.

[env:esp32-c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

; The MAX30102 driver is the one of the real firmware, used in place (no copy).
lib_extra_dirs = ../pulsox/lib

; The "Super Mini" boards use the ESP32-C3's native USB-CDC (there's no
; separate USB-UART chip), so Serial needs these to show up on the USB port.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
