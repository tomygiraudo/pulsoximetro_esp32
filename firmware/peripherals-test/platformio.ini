; Peripheral bring-up test for the PulsOx PCB (ESP32-C3 Super Mini).
; Not the real PulsOx firmware — it only checks that the MAX30102 answers on
; I2C and that the 1.44" ST7735S TFT answers on SPI, using the pins from
; PCB/Sensor_ctrl_pwr_pcb (see the pin table in src/main.cpp).

[env:esp32-c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

; The "Super Mini" boards use the ESP32-C3's native USB-CDC (there's no
; separate USB-UART chip), so Serial needs these to show up on the USB port.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    adafruit/Adafruit GFX Library@^1.12.6
    adafruit/Adafruit ST7735 and ST7789 Library@^1.11.0
