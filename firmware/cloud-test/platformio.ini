; Cloud-client test for the ESP32-C3 Super Mini.
; Not the real PulsOx firmware — a simulated measurement (no sensor, no TFT)
; written to Firebase Realtime Database over REST, to validate the cloud
; contract (PROTOCOL.md, "Transporte en la nube") on real hardware.

[env:esp32-c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

; The "Super Mini" boards use the ESP32-C3's native USB-CDC (there's no
; separate USB-UART chip), so Serial needs these to show up on the USB port.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
