; PulsOx firmware (ESP32-C3 Super Mini + MAX30102).
; This is the real firmware, as opposed to firmware/peripherals-test and
; firmware/battery-test, which only exercise the hardware. Pin table in
; include/config.h (taken from PCB/Sensor_ctrl_pwr_pcb).

[platformio]
; `pio run -t upload` with no -e keeps building the real firmware, not the demo.
default_envs = esp32-c3-supermini

[env:esp32-c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

; The "Super Mini" boards use the ESP32-C3's native USB-CDC (there's no
; separate USB-UART chip), so Serial needs these to show up on the USB port.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; TFT panel (src/display.cpp -> lib/tft_st7735).
lib_deps =
    adafruit/Adafruit GFX Library@^1.12.6
    adafruit/Adafruit ST7735 and ST7789 Library@^1.11.0

; Shows every TFT screen with fake data (src/display_demo.cpp), no sensor needed:
;   pio run -e ui-demo -t upload
; It swaps main.cpp for the demo's own setup()/loop().
[env:ui-demo]
extends = env:esp32-c3-supermini
build_src_filter = +<*> -<main.cpp>
build_flags =
    ${env:esp32-c3-supermini.build_flags}
    -DPULSOX_DISPLAY_DEMO
